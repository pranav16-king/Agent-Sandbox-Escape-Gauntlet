# ==============================================================================
# PS01 Agent Sandbox Escape Gauntlet - Hardened Squid Egress Proxy Configuration
# ==============================================================================

# Listen on default proxy port
http_port 3128

# Standard and SSL Port Definitions
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# 1. Enforce CONNECT tunnel ONLY on SSL port 443 (blocks SSH, reverse shells on 4444, etc.)
http_access deny CONNECT !SSL_ports

# 2. Block outbound traffic to unapproved target ports
http_access deny !Safe_ports

# 3. Domain Allowlist ACL
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"

# 4. Access Evaluation: Explicit allowlist only, default deny everything else
http_access allow allowed_domains
http_access deny all

# 5. Security & Privacy Hardening: Strip proxy leaks and internal metadata
forwarded_for off
request_header_access Via deny all
request_header_access X-Forwarded-For deny all
reply_header_access Server deny all

# 6. Operational Parameters
shutdown_lifetime 1 seconds
access_log stdio:/var/log/squid/access.log squid
