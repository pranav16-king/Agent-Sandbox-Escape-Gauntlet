# ==============================================================================
# PS01 Agent Sandbox Escape Gauntlet - Hardened dnsmasq Configuration
# ==============================================================================

# 1. Do not use host /etc/resolv.conf or poll for changes
no-resolv
no-poll

# 2. DNS Rebinding Defense: reject upstream responses pointing to private IP space
stop-dns-rebind

# 3. Privacy & Leak Prevention
domain-needed
bogus-priv

# 4. Bind strictly to local network interfaces
bind-interfaces

# 5. Domain-Scoped Upstream Forwarding: Forward ONLY approved domains to trusted resolver
server=/pypi.org/1.1.1.1
server=/pythonhosted.org/1.1.1.1
server=/python.org/1.1.1.1
server=/github.com/1.1.1.1
server=/githubusercontent.com/1.1.1.1
server=/huggingface.co/1.1.1.1
server=/openai.com/1.1.1.1
server=/anthropic.com/1.1.1.1
server=/typicode.com/1.1.1.1

# 6. Default Deny Sinkhole: Any query outside the allowlist resolves to 0.0.0.0
address=/#/0.0.0.0

# 7. Audit & DNS Tunneling Telemetry
log-queries
log-facility=-
